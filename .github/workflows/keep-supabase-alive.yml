name: Keep Supabase alive

# El plan gratuito pausa el proyecto tras ~7 días sin actividad.
# La anon key no puede leer nada (RLS + sin permisos), así que la actividad real
# se genera con una consulta vía Management API usando SUPABASE_ACCESS_TOKEN.
#
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  token personal dedicado (sbp_…)
#   SUPABASE_PROJECT_REF   rnghppmuqbdpbkkljnsr
#   SUPABASE_URL           https://rnghppmuqbdpbkkljnsr.supabase.co
#   SUPABASE_ANON_KEY      clave publishable/anon (pública)

on:
  schedule:
    - cron: '0 9 */2 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Resume project if paused (Supabase Management API)
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "No SUPABASE_ACCESS_TOKEN - skipping resume attempt"
            exit 0
          fi
          curl -s -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/restore" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" -o /dev/null || true
          echo "Resume attempt sent - waiting up to 5 min for Supabase to wake up..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/" -H "apikey: $ANON_KEY")
            echo "Check $i/20 - HTTP status: $STATUS"
            if [ "$STATUS" != "000" ] && [ "$STATUS" != "521" ] && [ "$STATUS" != "503" ]; then
              echo "Supabase is up!"
              break
            fi
            sleep 15
          done

      - name: Real database query (counts as activity in Supabase)
        run: |
          if [ -n "$ACCESS_TOKEN" ]; then
            STATUS=$(curl -s -o /tmp/out.json -w "%{http_code}" -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"query":"select count(*) as staff from montaigne_fix.staff"}')
            echo "Management API query - HTTP status: $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
              echo "Supabase alive: $(cat /tmp/out.json)"
              exit 0
            fi
            echo "Management API query failed, falling back to REST ping"
            if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
              TOKEN_INVALID=1
            fi
          fi
          # Respaldo: PostgREST ejecuta la consulta en Postgres aunque responda 401
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/staff?select=id&limit=1" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" \
            -H "Accept-Profile: montaigne_fix")
          echo "REST ping - HTTP status: $STATUS"
          if [ "$STATUS" = "000" ] || [ "$STATUS" = "503" ] || [ "$STATUS" = "521" ]; then
            echo "Supabase not reachable (status: $STATUS)"
            exit 1
          fi
          echo "Supabase responding (status: $STATUS)"
          if [ "${TOKEN_INVALID:-0}" = "1" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN rechazado (caducado o borrado). Sin él no se puede reactivar un proyecto pausado: genera uno nuevo y actualiza el secreto."
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "WARNING: Supabase ping failed. Project may be paused."
          echo "Go to https://supabase.com/dashboard/project/$PROJECT_REF to resume manually."
          exit 1
