name: Keep Supabase alive

# El plan gratuito pausa el proyecto tras ~7 días sin actividad.
# Este job pide restore si hace falta, ejecuta una consulta real vía keepalive
# y comprueba que las webs públicas responden.
#
# Secretos (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN    token personal de la cuenta (sbp_…), para restore
#   SUPABASE_PROJECT_REF     rnghppmuqbdpbkkljnsr
#   SUPABASE_KEEPALIVE_URL   https://<ref>.supabase.co/functions/v1/keepalive
#   KEEPALIVE_TOKEN          el mismo valor que el secreto de Supabase

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      KEEPALIVE_URL: ${{ secrets.SUPABASE_KEEPALIVE_URL }}
      KEEPALIVE_TOKEN: ${{ secrets.KEEPALIVE_TOKEN }}
    steps:
      - name: Resume project if paused (Supabase Management API)
        run: |
          set -euo pipefail
          if [ -z "${ACCESS_TOKEN:-}" ]; then
            echo "No SUPABASE_ACCESS_TOKEN - skipping resume attempt"
            exit 0
          fi
          if [ -z "${PROJECT_REF:-}" ]; then
            echo "Falta SUPABASE_PROJECT_REF"
            exit 1
          fi
          curl --retry 3 --retry-delay 20 --retry-all-errors --max-time 30 -sS -o /dev/null \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/restore" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" || true
          echo "Resume attempt sent - waiting up to 5 min for Supabase to wake up..."
          URL="${KEEPALIVE_URL:-}"
          if [ -z "$URL" ]; then
            echo "Falta SUPABASE_KEEPALIVE_URL"
            exit 1
          fi
          for i in $(seq 1 20); do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 -X POST "$URL" || echo "000")
            echo "Check $i/20 - HTTP status: $STATUS"
            if [ "$STATUS" != "000" ] && [ "$STATUS" != "521" ] && [ "$STATUS" != "503" ]; then
              echo "Supabase is up!"
              break
            fi
            sleep 15
          done

      - name: Keepalive (real database query)
        run: |
          set -euo pipefail
          if [ -z "${KEEPALIVE_URL:-}" ] || [ -z "${KEEPALIVE_TOKEN:-}" ]; then
            echo "Faltan SUPABASE_KEEPALIVE_URL o KEEPALIVE_TOKEN"
            exit 1
          fi
          STATUS="000"
          for i in 1 2 3; do
            STATUS=$(curl -sS -o /tmp/ka.json -w "%{http_code}" --max-time 30 \
              -X POST "$KEEPALIVE_URL" \
              -H "x-keepalive-token: ${KEEPALIVE_TOKEN}" \
              -H "Content-Type: application/json" || echo "000")
            echo "Keepalive attempt $i/3 - HTTP status: $STATUS"
            if [ "$STATUS" = "200" ] && python3 -c 'import json,sys; d=json.load(open("/tmp/ka.json")); sys.exit(0 if d.get("ok") is True else 1)'; then
              echo "Keepalive OK"
              exit 0
            fi
            if [ "$i" -lt 3 ]; then sleep 20; fi
          done
          echo "Keepalive failed (status: $STATUS)"
          exit 1

      - name: Public sites respond
        run: |
          set -euo pipefail
          check() {
            local url="$1"
            local status="000"
            for i in 1 2 3; do
              status=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 -L "$url" || echo "000")
              echo "$url attempt $i/3 - HTTP status: $status"
              if [ "$status" = "200" ]; then
                return 0
              fi
              if [ "$i" -lt 3 ]; then sleep 20; fi
            done
            echo "$url failed (status: $status)"
            return 1
          }
          check "https://montaignefix.pages.dev/"
          check "https://montaignefix.vercel.app"
          check "https://montaignefix.vercel.app/equipo"
